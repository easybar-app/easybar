<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">EasyBar icon</title>
  <desc id="desc">A martini glass whose rim completes a lowercase E silhouette.</desc>

  <defs>
    <linearGradient id="background" x1="72" y1="40" x2="440" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#272c35"/>
      <stop offset="0.52" stop-color="#171a20"/>
      <stop offset="1" stop-color="#0c0e11"/>
    </linearGradient>
    <linearGradient id="letter" x1="108" y1="92" x2="408" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#69bdff"/>
      <stop offset="1" stop-color="#3e8eed"/>
    </linearGradient>
    <linearGradient id="glass" x1="168" y1="250" x2="340" y2="446" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc15b"/>
      <stop offset="1" stop-color="#ed8a2a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#background)"/>
  <rect x="10" y="10" width="492" height="492" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- The glass rim continues the surrounding curve to form a lowercase E. -->
  <path
    d="M396 258
       C396 168 338 108 256 108
       C160 108 98 176 98 266
       C98 358 166 416 260 416
       C318 416 366 396 400 358"
    fill="none"
    stroke="url(#letter)"
    stroke-width="44"
    stroke-linecap="round"
  />
  <path
    d="M172 258H396L256 344L172 258Z"
    fill="#ed8a2a"
    fill-opacity="0.09"
    stroke="url(#glass)"
    stroke-width="22"
    stroke-linejoin="round"
  />
  <path d="M256 344V414" fill="none" stroke="url(#glass)" stroke-width="22" stroke-linecap="round"/>
  <path d="M190 430H322" fill="none" stroke="url(#glass)" stroke-width="22" stroke-linecap="round"/>
</svg>
