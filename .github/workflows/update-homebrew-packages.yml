name: Update Homebrew packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-homebrew-packages
  cancel-in-progress: false

jobs:
  update-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Validate release tag input
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${INPUT_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Invalid release tag: ${INPUT_TAG}" >&2
            exit 1
          fi

      - name: Checkout EasyBar release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Derive asset URLs
        id: vars
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          scripts/release/derive-release-vars.sh \
            --tag "${INPUT_TAG}" \
            --repository "${GITHUB_REPOSITORY}"

      - name: Download release archives
        shell: bash
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            "${{ steps.vars.outputs.asset_url }}" \
            -o EasyBar.zip
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            "${{ steps.vars.outputs.calendar_agent_asset_url }}" \
            -o EasyBarCalendarAgent.zip
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            "${{ steps.vars.outputs.network_agent_asset_url }}" \
            -o EasyBarNetworkAgent.zip

      - name: Compute SHA-256
        id: sha
        shell: bash
        run: |
          SHA="$(sha256sum EasyBar.zip | awk '{print $1}')"
          CALENDAR_AGENT_SHA="$(sha256sum EasyBarCalendarAgent.zip | awk '{print $1}')"
          NETWORK_AGENT_SHA="$(sha256sum EasyBarNetworkAgent.zip | awk '{print $1}')"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "calendar_agent_sha=${CALENDAR_AGENT_SHA}" >> "$GITHUB_OUTPUT"
          echo "network_agent_sha=${NETWORK_AGENT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: easybar-app/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update EasyBar Homebrew packages
        shell: bash
        run: |
          scripts/release/update-homebrew-packages.sh \
            --tap-dir homebrew-tap \
            --repository "${GITHUB_REPOSITORY}" \
            --version "${{ steps.vars.outputs.version }}" \
            --sha "${{ steps.sha.outputs.sha }}" \
            --calendar-agent-sha "${{ steps.sha.outputs.calendar_agent_sha }}" \
            --network-agent-sha "${{ steps.sha.outputs.network_agent_sha }}"

      - name: Commit and push Homebrew package changes
        shell: bash
        run: |
          scripts/release/commit-homebrew-packages.sh \
            --tap-dir homebrew-tap \
            --version "${{ steps.vars.outputs.version }}"
