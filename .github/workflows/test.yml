name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          path: easybar
      - uses: actions/checkout@v7
        with:
          repository: easybar-app/easybar-kit
          path: easybar-kit
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"
      - name: Run checks
        working-directory: easybar
        run: make check
